# TEST server next to the live one: own database, own cookies (gut_*), port ${PORT:-4556}, banner on every
# page (SITE_MODE=test), noindex, mock payments/trades and an always-on activity simulator (bots).
# Usage: bash deploy/setup-test.sh
name: graderup-test
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: graderup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.test-server}
      POSTGRES_DB: graderup
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U graderup -d graderup']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_COOKIE_PREFIX: gut
        SITE_MODE: test
    image: graderup-test-app
    restart: unless-stopped
    env_file: .env.test-server
    environment:
      DATABASE_URL: postgres://graderup:${POSTGRES_PASSWORD}@db:5432/graderup
      UPLOAD_DIR: /app/uploads
      PORT: '3000'
      SITE_MODE: test
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  sim:
    image: graderup-test-app
    restart: unless-stopped
    env_file: .env.test-server
    environment:
      DATABASE_URL: postgres://graderup:${POSTGRES_PASSWORD}@db:5432/graderup
      SITE_MODE: test
    command: ['sh', '-c', 'sleep 20 && npx tsx --conditions=react-server scripts/simulate-activity.ts --bots=${SIM_BOTS:-40} --interval=${SIM_INTERVAL:-2}']
    depends_on:
      - app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${PORT:-4556}:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
